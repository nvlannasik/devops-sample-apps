# Local stack. Mirrors the deployment contract: one migration pass, then four services.

# The connection, written once. Three services read it, and a fourth would too — three copies
# of the same host and password is how a local stack ends up half-pointed at the wrong database.
x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: sample
  DB_PASSWORD: sample
  DB_NAME: sample_app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample -d sample_app"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: services/orders-api/Dockerfile
    command: ["node", "services/orders-api/dist/db/migrate-cli.js"]
    environment:
      <<: *db-env
      SERVICE_VERSION: local
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  orders-api:
    build:
      context: .
      dockerfile: services/orders-api/Dockerfile
    environment:
      <<: *db-env
      SERVICE_VERSION: local
      LOG_LEVEL: debug
      PORT: "3000"
    ports:
      - "8082:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  settlement-worker:
    build:
      context: .
      dockerfile: services/settlement-worker/Dockerfile
    environment:
      <<: *db-env
      SERVICE_VERSION: local
      LOG_LEVEL: debug
      PORT: "3001"
    ports:
      - "8083:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  checkout-gateway:
    build:
      context: .
      dockerfile: services/checkout-gateway/Dockerfile
    environment:
      ORDERS_API_URL: http://orders-api:3000
      WORKER_URL: http://settlement-worker:3001
      SERVICE_VERSION: local
      LOG_LEVEL: debug
      PORT: "3000"
    ports:
      - "8081:3000"
    depends_on:
      - orders-api
      - settlement-worker

  storefront:
    build:
      context: .
      dockerfile: services/storefront/Dockerfile
    environment:
      GATEWAY_URL: http://checkout-gateway:3000
      SERVICE_VERSION: local
      LOG_LEVEL: debug
      PORT: "3000"
      # Followed by a browser, so it is the published port, never the compose service name.
      LOADGEN_UI_URL: http://localhost:8090
    ports:
      - "8080:3000"
    depends_on:
      - checkout-gateway

  # Same image as the storefront, different entry point. Comes up idle and drives nothing until
  # the control page says so.
  loadgen:
    build:
      context: .
      dockerfile: services/storefront/Dockerfile
    command: ["node", "services/storefront/dist/loadgen-server.js"]
    environment:
      TARGET_URL: http://storefront:3000
      SERVICE_VERSION: local
      LOG_LEVEL: debug
      PORT: "3000"
      LOADGEN_UI_PASSWORD: local-demo
      # Plain HTTP on a published port: a Secure cookie would be dropped in silence and the
      # login form would just keep reappearing.
      LOADGEN_UI_COOKIE_SECURE: "false"
    ports:
      - "8090:3000"
    depends_on:
      - storefront
