# Reference manifests for the four sample-app services.
#
# THIS REPO DEPLOYS NOTHING. This file is handover material: copy it into your manifest repo,
# or apply it directly to a scratch cluster. It is not reconciled from here.
#
#   kubectl apply -f docs/k8s/sample-app.yaml
#
# Before applying, replace two placeholders throughout:
#   ghcr.io/OWNER/  → your registry
#   GIT_SHA         → the tag you built (`git rev-parse --short HEAD`)
#
# The alert rules and the Prometheus scrape job are NOT here — they are Helm values for the
# community prometheus chart, not cluster objects. See DEPLOYMENT_CONTRACT.md §6 and §9, and
# docs/alerting/sample-app-rules.yaml. Applying this file without doing that leaves every app
# rule evaluating an empty vector: nothing fires and nothing errors.
#
# Two labels are load-bearing and must not be renamed:
#   metadata.labels.app on the pod template → relabelled to `service` by the scrape job, which
#                                             is what every alert rule groups by
#   the namespace name                      → must match sample-app.*, selected by
#                                             SampleAppNotReady and SampleAppNoEndpoints
---
apiVersion: v1
kind: Namespace
metadata:
  name: sample-app
---
# Replace CHANGEME. Points at whatever Postgres you run; the Bitnami chart's service name is
# <release>-postgresql. The database must already exist — the chart creates it only when
# auth.database is set AND only on first init of an empty PVC (DEPLOYMENT_CONTRACT.md §8).
#
# One Secret, consumed with envFrom by the migration Job, orders-api and settlement-worker.
# Discrete keys rather than a URL: DB_PASSWORD can then be rotated (or sourced from an
# ExternalSecret) on its own, without re-templating a connection string, and the app's boot log
# redacts it by key name.
apiVersion: v1
kind: Secret
metadata:
  name: sample-app-db
  namespace: sample-app
stringData:
  DB_HOST: sample-app-postgres
  DB_PORT: "5432"
  DB_USERNAME: sample
  DB_PASSWORD: CHANGEME
  DB_NAME: sample_app
  # disable | require | verify-ca | verify-full. An unknown value fails at boot rather than
  # falling back to an unencrypted connection.
  DB_SSL_MODE: disable
---
# Runs once per release, BEFORE the app rollout. orders-api and settlement-worker refuse to
# boot against an un-migrated schema unless MIGRATION_REQUIRED=false.
# Re-running is safe: the runner takes advisory lock 4927313, so concurrent Jobs serialise.
apiVersion: batch/v1
kind: Job
metadata:
  name: sample-app-migrate
  namespace: sample-app
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: sample-app-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/OWNER/sample-app-orders-api:GIT_SHA
          command: ["node", "services/orders-api/dist/db/migrate-cli.js"]
          envFrom:
            - secretRef:
                name: sample-app-db
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3000"
    spec:
      # Above GRACEFUL_SHUTDOWN_MS (default 10s), or the kubelet SIGKILLs mid-drain and
      # in-flight requests die as connection resets with nothing in any log.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # the `node` user in node:24-alpine; the images do not set USER
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/OWNER/sample-app-storefront:GIT_SHA
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SERVICE_VERSION
              value: GIT_SHA
            - name: DEPLOYMENT_ENV
              value: dev
            - name: GATEWAY_URL
              value: http://checkout-gateway:3000
            # Puts a "Load generator" button in the storefront header. A BROWSER follows this,
            # so it must be an address a browser can reach — the Ingress host, or the
            # port-forward you use for a demo. The cluster-internal Service DNS resolves to
            # nothing outside the cluster, and the button would 404 for every visitor.
            # Unset hides the button entirely, which is the right state when not demoing.
            - name: LOADGEN_UI_URL
              value: ""
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: sample-app
spec:
  selector:
    app: storefront
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-gateway
  namespace: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-gateway
  template:
    metadata:
      labels:
        app: checkout-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3000"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/OWNER/sample-app-checkout-gateway:GIT_SHA
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SERVICE_VERSION
              value: GIT_SHA
            - name: DEPLOYMENT_ENV
              value: dev
            - name: ORDERS_API_URL
              value: http://orders-api:3000
            - name: WORKER_URL
              value: http://settlement-worker:3001
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-gateway
  namespace: sample-app
spec:
  selector:
    app: checkout-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3000"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/OWNER/sample-app-orders-api:GIT_SHA
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: sample-app-db
          env:
            - name: SERVICE_VERSION
              value: GIT_SHA
            - name: DEPLOYMENT_ENV
              value: dev
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          # Deliberately /healthz, not /readyz: /healthz ignores the database unless
          # LIVENESS_CHECKS_DB=true. Pointing liveness at a dependency is the restart-storm
          # fault (DEPLOYMENT_CONTRACT.md §3), not the default.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: sample-app
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-worker
  namespace: sample-app
spec:
  # Single replica on purpose. The queue is SKIP LOCKED so more replicas are safe, but one
  # makes queue_depth and queue_oldest_job_age_seconds attributable to a single process.
  replicas: 1
  selector:
    matchLabels:
      app: settlement-worker
  template:
    metadata:
      labels:
        app: settlement-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3001"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/OWNER/sample-app-settlement-worker:GIT_SHA
          ports:
            - name: admin
              containerPort: 3001
          envFrom:
            - secretRef:
                name: sample-app-db
          env:
            - name: SERVICE_VERSION
              value: GIT_SHA
            - name: DEPLOYMENT_ENV
              value: dev
            - name: PORT
              value: "3001"
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            # 256Mi is deliberate: it is what makes SETTLEMENT_BATCH_SIZE=200000 reach the OOM
            # killer in bounded time instead of swelling forever.
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
# Admin port only — this service takes no user traffic. It exists so checkout-gateway can
# reach /queue-stats for chain-status, and so Prometheus can scrape /metrics.
apiVersion: v1
kind: Service
metadata:
  name: settlement-worker
  namespace: sample-app
spec:
  selector:
    app: settlement-worker
  ports:
    - name: admin
      port: 3001
      targetPort: admin
---
# Traffic source. Rate-based rules (SampleAppHighErrorRate, SampleAppHighLatency) do not exist
# at zero requests per second — this is a prerequisite for most scenarios, not an extra.
#
# A Deployment, not a Job: the pod comes up IDLE and drives nothing until its control page says
# so, so starting and stopping load is a button rather than a redeploy. Reach it with
#   kubectl -n sample-app port-forward svc/sample-app-loadgen 8090:3000
# and open http://localhost:8090. Set LOADGEN_AUTOSTART=true to have it drive from boot instead.
#
# Deliberately NOT annotated for scraping: its own http_client_* series would be aggregated into
# job="sample-app" and pollute the numbers the agent is investigating, and it would change the
# `up{job="sample-app"}` baseline that DEPLOYMENT_CONTRACT.md §10 tells the operator to expect.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-loadgen
  namespace: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app-loadgen
  template:
    metadata:
      labels:
        app: sample-app-loadgen
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: loadgen
          image: ghcr.io/OWNER/sample-app-storefront:GIT_SHA
          command: ["node", "services/storefront/dist/loadgen-server.js"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SERVICE_VERSION
              value: GIT_SHA
            - name: TARGET_URL
              value: http://storefront.sample-app.svc.cluster.local:3000
            # Seeds the control form. Every one of these is editable at runtime on the page.
            - name: LOADGEN_RPS
              value: "10"
            - name: LOADGEN_CONCURRENCY
              value: "1"     # raise to 5+ for SSR_CONCURRENCY=1 or DB_POOL_MAX=1 — one worker
                             # is one in-flight request and can never make the server queue
            - name: LOADGEN_DURATION_SECONDS
              value: "0"     # 0 = run until stopped
            - name: LOADGEN_CHECKOUT_RATIO
              value: "0.3"   # keep above 0, or ORDER_RESPONSE_VERSION=2 has nothing to break
            - name: LOADGEN_AUTOSTART
              value: "false" # true = start driving at boot, without touching the page
            # Required. Unset and the page serves 503 rather than an anonymous Start button.
            # Put it in a Secret in any cluster anyone else can reach.
            - name: LOADGEN_UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sample-app-loadgen
                  key: LOADGEN_UI_PASSWORD
            # Leave true behind TLS. Set false only for a plain-HTTP hostname: a Secure cookie
            # is dropped there in silence and the login form just reappears forever.
            - name: LOADGEN_UI_COOKIE_SECURE
              value: "true"
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
# Replace CHANGEME before this reaches any cluster someone else can see. The page behind this
# password starts real traffic; it is not a viewer.
apiVersion: v1
kind: Secret
metadata:
  name: sample-app-loadgen
  namespace: sample-app
stringData:
  LOADGEN_UI_PASSWORD: CHANGEME
---
# Exposing this is a deliberate choice, not a default. The page is behind a shared password with
# a signed session cookie and a failed-login throttle, and it serves 503 rather than a Start
# button if that password is unset — but it is still a control surface that puts load on the
# cluster. Put TLS in front of it, or keep it on port-forward.
apiVersion: v1
kind: Service
metadata:
  name: sample-app-loadgen
  namespace: sample-app
spec:
  selector:
    app: sample-app-loadgen
  ports:
    - name: http
      port: 3000
      targetPort: http
